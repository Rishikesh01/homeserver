# Pi-hole v6 (single FTL webserver — no separate lighttpd).
services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped
    ports:
      # DNS stays published LAN-wide — that's the whole point of Pi-hole. Default 0.0.0.0 =
      # listen on every interface. If something else already holds :53 on this host
      # (systemd-resolved, or libvirt/LXC dnsmasq), either free it or pin PIHOLE_DNS_BIND
      # to this host's LAN IP in .env.
      - "${PIHOLE_DNS_BIND:-0.0.0.0}:53:53/tcp"
      - "${PIHOLE_DNS_BIND:-0.0.0.0}:53:53/udp"
      # The web admin UI is NOT published: Caddy reaches it over the shared "edge" network as
      # pihole:80 and serves it over HTTPS, so it isn't exposed as plaintext HTTP on the LAN.
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Web/API password for the admin panel.
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # Upstream resolvers (semicolon separated). Cloudflare + Quad9 here.
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAMS:-1.1.1.1;9.9.9.9}
      # Reply to DNS queries arriving on any interface.
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - pihole-etc:/etc/pihole
      # Optional local DNS records (normally empty — apps are reached by IP). To add
      # any: edit custom.list, then `docker exec pihole pihole reloaddns`.
      - ./custom.list:/etc/pihole/hosts/custom.list:ro
    cap_add:
      - SYS_NICE       # lets FTL tune its own priority; harmless if denied
    dns:
      - 127.0.0.1
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edge

volumes:
  pihole-etc:

networks:
  edge:
    external: true
    name: homeserver-edge
