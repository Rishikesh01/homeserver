services:
  it-tools:
    # 100+ web utilities: converters, image<->base64, QR, hashes, formatters, etc.
    image: ${ITTOOLS_IMAGE:-ghcr.io/corentinth/it-tools:2024.10.22-7ca5933}
    container_name: it-tools
    restart: unless-stopped
    # No published port: Caddy reaches it over the shared "edge" network as it-tools:80.
    networks:
      - edge

networks:
  edge:
    external: true
    name: homeserver-edge
