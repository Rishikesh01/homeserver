services:
  vaultwarden:
    image: vaultwarden/server:1.36.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # VW_ADMIN_TOKEN is an Argon2id HASH (set/rotate via: hsctl secrets rotate-vw-admin).
      # In .env every '$' is doubled to '$$' so this interpolation yields the real hash.
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN}
      # Public URL clients/mobile apps will use. Must be https in production.
      DOMAIN: ${VW_DOMAIN}
      # Disable open signups once you've created your account.
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED:-true}
      # Send invitations only — recommended after initial setup.
      INVITATIONS_ALLOWED: "true"
    volumes:
      - vw-data:/data
    # No published port: Caddy reaches this over the shared "edge" network as vaultwarden:80,
    # so the vault is never exposed as plaintext HTTP on the LAN — only Caddy's HTTPS is.
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/vaultwarden", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vw-data:

networks:
  edge:
    external: true
    name: homeserver-edge
