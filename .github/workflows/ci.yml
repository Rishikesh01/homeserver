name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    name: gofmt + vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hsctl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hsctl/go.mod
          cache-dependency-path: hsctl/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The tests are behind the integration build tag, so vet them with it too.
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hsctl/go.mod
          cache-dependency-path: hsctl/go.sum

      # Compiles each package's tests and runs them as root against a real Docker daemon, restic,
      # a registry and the stack's own images, inside a throwaway privileged Docker-in-Docker
      # container (hsctl/test/run-integration.sh).
      - name: make test-integration
        run: make -C hsctl test-integration

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `make build` stamps the version from `git describe --tags`

      - uses: actions/setup-go@v5
        with:
          go-version-file: hsctl/go.mod
          cache-dependency-path: hsctl/go.sum

      - name: make build
        run: make -C hsctl build

      - name: Check the binary runs
        run: ./hsctl/hsctl --version
