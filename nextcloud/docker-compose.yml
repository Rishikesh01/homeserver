services:
  db:
    image: ${NEXTCLOUD_DB_IMAGE:-postgres:18-alpine}
    container_name: nextcloud-db
    restart: unless-stopped
    # The postgres image stops on SIGINT (a clean "fast shutdown"). Give it room to finish that
    # cleanly before Docker's SIGKILL, so a stop/restart/restore never truncates a checkpoint.
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data-v18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}",
        ]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: ${NEXTCLOUD_REDIS_IMAGE:-redis:8-alpine}
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  app:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published port: Caddy reaches the app over the shared "edge" network as
    # nextcloud-app:80, so Nextcloud (and its login) is never plaintext HTTP on the LAN.
    # `app` stays on the project's default network too, to reach db + redis by name.
    networks:
      - default
      - edge
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      # Space-separated list of hostnames you'll reach Nextcloud on.
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_TRUSTED_DOMAINS}
      # Tells Nextcloud it's behind a TLS-terminating proxy.
      OVERWRITEPROTOCOL: https
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: ${NC_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - nc-html:/var/www/html # app + config + apps
      - nc-data:/var/www/html/data # user files — back this up

volumes:
  db-data:
  db-data-v18:
  redis-data:
  nc-html:
  nc-data:

# db + redis have no `networks:` key, so they stay on the project-internal default network
# only — unreachable from edge. Just the app is bridged to Caddy.
networks:
  edge:
    external: true
    name: homeserver-edge
