services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"                                                  # CA download (http)
      - "${VAULT_HTTPS:-8443}:${VAULT_HTTPS:-8443}"              # Vaultwarden (https)
      - "${CLOUD_HTTPS:-8444}:${CLOUD_HTTPS:-8444}"              # Nextcloud (https)
      - "${PIHOLE_HTTPS:-8445}:${PIHOLE_HTTPS:-8445}"            # Pi-hole (https)
      - "${HOME_HTTPS:-443}:${HOME_HTTPS:-443}"                  # dashboard (https, port 443 = no :port in URL)
      - "${STIRLING_HTTPS:-8446}:${STIRLING_HTTPS:-8446}"        # Stirling-PDF (https)
      - "${ITTOOLS_HTTPS:-8447}:${ITTOOLS_HTTPS:-8447}"          # IT-Tools (https)
      - "${IMAGETOOLS_HTTPS:-8448}:${IMAGETOOLS_HTTPS:-8448}"    # Image tool (https)
    # Lets Caddy reach the services on the host's published ports.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-you@example.com}
      # Server LAN IP — used as the cert SAN so https://<ip>:<port> is trusted.
      SERVER_IP: ${SERVER_IP}
      # App upstreams are the container names on the shared "edge" network (below), NOT
      # host-published ports — so the apps no longer expose plaintext HTTP on the LAN and
      # Caddy is the only way in. The defaults are the source of truth; .env may override.
      VAULT_UPSTREAM: ${VAULT_UPSTREAM:-vaultwarden:80}
      CLOUD_UPSTREAM: ${CLOUD_UPSTREAM:-nextcloud-app:80}
      PIHOLE_UPSTREAM: ${PIHOLE_UPSTREAM:-pihole:80}
      # The hsctl web UI runs on the HOST (not a container), so this one still goes through
      # the docker host gateway. hsctl binds it to the gateway + loopback, never the LAN.
      HOME_UPSTREAM: ${HOME_UPSTREAM:-host.docker.internal:8088}
      STIRLING_UPSTREAM: ${STIRLING_UPSTREAM:-stirling-pdf:8080}
      ITTOOLS_UPSTREAM: ${ITTOOLS_UPSTREAM:-it-tools:80}
      IMAGETOOLS_UPSTREAM: ${IMAGETOOLS_UPSTREAM:-imagetools:80}
      # HTTPS ports each app is exposed on (must match services.json on the dashboard).
      VAULT_HTTPS: ${VAULT_HTTPS:-8443}
      CLOUD_HTTPS: ${CLOUD_HTTPS:-8444}
      PIHOLE_HTTPS: ${PIHOLE_HTTPS:-8445}
      HOME_HTTPS: ${HOME_HTTPS:-443}
      STIRLING_HTTPS: ${STIRLING_HTTPS:-8446}
      ITTOOLS_HTTPS: ${ITTOOLS_HTTPS:-8447}
      IMAGETOOLS_HTTPS: ${IMAGETOOLS_HTTPS:-8448}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # issued certs + local CA root — back this up
      - caddy-config:/config
    networks:
      - edge

volumes:
  caddy-data:
  caddy-config:

# Shared reverse-proxy network. Every app joins it so Caddy reaches them by container name
# instead of a host-published port — created by hsctl (`docker network create homeserver-edge`)
# before the stack comes up, hence external. This is what keeps the apps off the LAN.
networks:
  edge:
    external: true
    name: homeserver-edge
